<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cesi Tayfa Sesli Odalar</title>
  
  <!-- Telegram WebApp & Socket.io SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #0b141d;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    /* Sekme Menüsü (Grup / Özel) */
    .tabs {
      display: flex;
      background: #17212b;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      background: transparent;
      border: none;
      color: #7f91a4;
      font-weight: 600;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #2b5278;
      color: #ffffff;
    }

    /* Ana Buton */
    .create-btn {
      width: 100%;
      padding: 14px;
      background: #0088cc;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
      margin-bottom: 20px;
    }

    .create-btn:active {
      transform: scale(0.98);
    }

    /* Oda Kartları */
    .rooms-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state {
      text-align: center;
      color: #6c7883;
      margin-top: 60px;
      font-size: 15px;
    }

    .room-card {
      background: #17212b;
      padding: 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #242f3d;
      cursor: pointer;
    }

    .room-info h4 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .room-info p {
      font-size: 13px;
      color: #6c7883;
    }

    .room-badge {
      background: #242f3d;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: #0088cc;
      font-weight: 600;
    }

    /* Modallar */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal {
      background: #17212b;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      border: 1px solid #242f3d;
    }

    .modal h3 {
      margin-bottom: 16px;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #7f91a4;
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      background: #0e1621;
      border: 1px solid #242f3d;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel { background: #242f3d; color: white; }
    .btn-submit { background: #0088cc; color: white; }

    /* Aktif Oda Ekranı */
    .room-view {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .room-header {
      padding: 16px;
      background: #17212b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }

    .slot-card {
      background: #17212b;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border: 1px dashed #242f3d;
      min-height: 120px;
      cursor: pointer;
    }

    .slot-card.filled {
      border: 1px solid #2b5278;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #2b5278;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .room-controls {
      padding: 16px;
      background: #17212b;
      display: flex;
      gap: 12px;
    }

    .ctrl-btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #242f3d;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .ctrl-btn.danger { background: #e53935; }
    .ctrl-btn.active { background: #0088cc; }

    /* Sohbet Penceresi */
    .chat-messages {
      height: 200px;
      overflow-y: auto;
      background: #0e1621;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-msg {
      font-size: 13px;
    }

    .chat-msg .sender {
      color: #0088cc;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- ODA LİSTESİ SAYFASI -->
  <div id="mainPage" class="container">
    <div class="tabs">
      <button id="tabGroup" class="tab-btn active">Grup Odaları</button>
      <button id="tabPrivate" class="tab-btn">Özel Odalar</button>
    </div>

    <button id="btnOpenCreateModal" class="create-btn">+ Oda Oluştur</button>

    <div id="roomsList" class="rooms-list">
      <div class="empty-state">Henüz aktif sesli oda yok.</div>
    </div>
  </div>

  <!-- AKTİF ODA SAYFASI -->
  <div id="roomPage" class="room-view">
    <div class="room-header">
      <div>
        <h3 id="activeRoomTitle">Oda Başlığı</h3>
        <span id="activeRoomType" style="font-size:12px; color:#7f91a4;">Grup Odası</span>
      </div>
      <button onclick="leaveRoom()" class="ctrl-btn danger" style="flex:none; padding:8px 16px;">Ayrıl</button>
    </div>

    <div id="slotsContainer" class="slots-grid"></div>

    <div class="room-controls">
      <button id="btnToggleMic" onclick="toggleMic()" class="ctrl-btn">🎤 Mikrofon Kapalı</button>
      <button onclick="openChatModal()" class="ctrl-btn">💬 Sohbet</button>
    </div>
  </div>

  <!-- MODAL: ODA OLUŞTUR -->
  <div id="createRoomModal" class="modal-overlay">
    <div class="modal">
      <h3>Oda Oluştur</h3>
      <div class="form-group">
        <label>Oda Başlığı</label>
        <input type="text" id="inputRoomTitle" placeholder="Örn: Muhabbet Odası">
      </div>
      <div class="form-group">
        <label>Oda Türü</label>
        <select id="selectRoomType">
          <option value="false">Grup Odası</option>
          <option value="true">Özel Oda</option>
        </select>
      </div>
      <div class="form-group">
        <label>Koltuk Kapasitesi</label>
        <select id="selectCapacity">
          <option value="4">4 Kişilik</option>
          <option value="6">6 Kişilik</option>
          <option value="8">8 Kişilik</option>
        </select>
      </div>
      <div class="modal-actions">
        <button onclick="closeCreateModal()" class="btn-cancel">İptal</button>
        <button onclick="submitCreateRoom()" class="btn-submit">Oluştur</button>
      </div>
    </div>
  </div>

  <!-- MODAL: SOHBET -->
  <div id="chatModal" class="modal-overlay">
    <div class="modal">
      <h3>Oda Sohbeti</h3>
      <div id="chatBox" class="chat-messages"></div>
      <div style="display:flex; gap:6px;">
        <input type="text" id="inputChatText" placeholder="Mesaj yazın..." style="flex:1; padding:8px; background:#0e1621; border:1px solid #242f3d; color:white; border-radius:6px;">
        <button onclick="sendChatMessage()" class="btn-submit" style="padding:8px 14px; flex:none;">Gönder</button>
      </div>
      <button onclick="closeChatModal()" class="btn-cancel" style="width:100%; margin-top:10px;">Kapat</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.ready();

    // Kullanıcı bilgileri (Telegram WebApp veya varsayılan)
    const currentUser = {
      id: tg?.initDataUnsafe?.user?.id?.toString() || "5912932761",
      first_name: tg?.initDataUnsafe?.user?.first_name || "Kullanıcı"
    };

    // Socket.io Bağlantısı
    const socket = io("https://45.143.11.148.sslip.io", {
      transports: ["websocket", "polling"]
    });

    let currentTab = 'group'; // 'group' veya 'private'
    let allRooms = [];
    let currentActiveRoom = null;
    let isMuted = true;

    socket.on("connect", () => {
      socket.emit("register_user", currentUser);
    });

    // Sekme Geçişleri
    document.getElementById('tabGroup').onclick = () => {
      currentTab = 'group';
      document.getElementById('tabGroup').classList.add('active');
      document.getElementById('tabPrivate').classList.remove('active');
      renderRoomsList();
    };

    document.getElementById('tabPrivate').onclick = () => {
      currentTab = 'private';
      document.getElementById('tabPrivate').classList.add('active');
      document.getElementById('tabGroup').classList.remove('active');
      renderRoomsList();
    };

    // Sunucudan Odalar Geldikçe Listeyi Yenile
    socket.on("rooms_update", (rooms) => {
      allRooms = rooms;
      renderRoomsList();
    });

    function renderRoomsList() {
      const container = document.getElementById('roomsList');
      const filtered = allRooms.filter(r => currentTab === 'private' ? r.isPrivate : !r.isPrivate);

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">Henüz aktif sesli oda yok.</div>';
        return;
      }

      container.innerHTML = filtered.map(room => `
        <div class="room-card" onclick="joinRoom('${room.id}')">
          <div class="room-info">
            <h4>${room.title}</h4>
            <p>${room.isPrivate ? '🔒 Özel Oda' : '👥 Grup Odası'}</p>
          </div>
          <div class="room-badge">${room.slots.filter(s => s.user).length} / ${room.capacity}</div>
        </div>
      `).join('');
    }

    // Modal İşlemleri
    document.getElementById('btnOpenCreateModal').onclick = () => {
      document.getElementById('createRoomModal').style.display = 'flex';
    };

    function closeCreateModal() {
      document.getElementById('createRoomModal').style.display = 'none';
    }

    function submitCreateRoom() {
      const title = document.getElementById('inputRoomTitle').value.trim();
      const isPrivate = document.getElementById('selectRoomType').value === 'true';
      const capacity = parseInt(document.getElementById('selectCapacity').value);

      socket.emit("create_room", {
        title: title || (isPrivate ? "Özel Oda" : "Grup Odası"),
        capacity: capacity,
        isPrivate: isPrivate,
        creator: currentUser
      });

      closeCreateModal();
    }

    // Odaya Katılma
    function joinRoom(roomId) {
      socket.emit("join_room", { roomId, user: currentUser }, (res) => {
        if (res.success) {
          currentActiveRoom = res.room;
          openRoomView();
        }
      });
    }

    // Detay Güncellemeleri
    socket.on("room_detail_update", (room) => {
      if (currentActiveRoom && currentActiveRoom.id === room.id) {
        currentActiveRoom = room;
        updateRoomUI();
      }
    });

    function openRoomView() {
      document.getElementById('mainPage').style.display = 'none';
      document.getElementById('roomPage').style.display = 'flex';
      updateRoomUI();
    }

    function updateRoomUI() {
      if (!currentActiveRoom) return;

      document.getElementById('activeRoomTitle').innerText = currentActiveRoom.title;
      document.getElementById('activeRoomType').innerText = currentActiveRoom.isPrivate ? '🔒 Özel Oda' : '👥 Grup Odası';

      const slotsContainer = document.getElementById('slotsContainer');
      slotsContainer.innerHTML = currentActiveRoom.slots.map((slot, index) => {
        if (slot.user) {
          return `
            <div class="slot-card filled">
              <div class="avatar">${slot.user.first_name[0]}</div>
              <div style="font-size:13px; font-weight:600;">${slot.user.first_name}</div>
              <div style="font-size:11px; color:#7f91a4;">${slot.isMuted ? '🔇 Mute' : '🎙️ Açık'}</div>
            </div>
          `;
        } else {
          return `
            <div class="slot-card" onclick="takeSlot(${index})">
              <div style="font-size:24px; color:#242f3d;">+</div>
              <div style="font-size:12px; color:#6c7883;">Koltuk Geç</div>
            </div>
          `;
        }
      }).join('');
    }

    function takeSlot(index) {
      if (!currentActiveRoom) return;
      socket.emit("take_slot", {
        roomId: currentActiveRoom.id,
        slotIndex: index,
        user: currentUser
      });
    }

    function toggleMic() {
      if (!currentActiveRoom) return;
      isMuted = !isMuted;
      const btn = document.getElementById('btnToggleMic');
      btn.innerText = isMuted ? '🎤 Mikrofon Kapalı' : '🎙️ Mikrofon Açık';
      btn.classList.toggle('active', !isMuted);

      socket.emit("toggle_mic", {
        roomId: currentActiveRoom.id,
        userId: currentUser.id,
        isMuted: isMuted
      });
    }

    function leaveRoom() {
      if (!currentActiveRoom) return;
      socket.emit("leave_room", {
        roomId: currentActiveRoom.id,
        userId: currentUser.id
      });

      currentActiveRoom = null;
      document.getElementById('roomPage').style.display = 'none';
      document.getElementById('mainPage').style.display = 'flex';
    }

    // Sohbet Modalı
    function openChatModal() {
      document.getElementById('chatModal').style.display = 'flex';
    }

    function closeChatModal() {
      document.getElementById('chatModal').style.display = 'none';
    }

    function sendChatMessage() {
      const input = document.getElementById('inputChatText');
      const text = input.value.trim();
      if (!text || !currentActiveRoom) return;

      socket.emit("send_chat_message", {
        roomId: currentActiveRoom.id,
        sender: currentUser,
        text: text
      });

      input.value = '';
    }

    socket.on("new_chat_message", (msg) => {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-msg';
      msgDiv.innerHTML = `<span class="sender">${msg.senderName}:</span> ${msg.text}`;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>

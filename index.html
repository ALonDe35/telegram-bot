<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesi Tayfa App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 16px; }
    .card { background: #1e293b; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
    .profile { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #38bdf8; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; }
    .room-title { font-size: 20px; font-weight: bold; margin: 12px 0; }
    .btn { width: 100%; background: #0088cc; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
    .badge { background: #22c55e; color: #000; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Profil Bilgisi -->
  <div class="card profile">
    <div class="avatar" id="user-avatar">A</div>
    <div>
      <div id="user-name" style="font-weight: bold;">Kullanıcı</div>
      <div id="user-handle" style="color: #94a3b8; font-size: 12px;">@username</div>
    </div>
  </div>

  <h3>Rooms in motion</h3>

  <!-- Örnek Oda -->
  <div class="card">
    <span class="badge">LIVE NOW</span>
    <div class="room-title">Test Oda</div>
    <div style="font-size: 12px; color: #94a3b8;">hosted by <span id="host-name">ALonDe35</span></div>
  </div>

  <!-- Oda Başlat Butonu -->
  <div class="card" style="text-align: center;">
    <p style="font-size: 14px; color: #94a3b8; margin-top: 0;">You can open a room for your group.</p>
    <button class="btn" onclick="startRoom()">((•)) Start a room</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
          const user = tg.initDataUnsafe.user;
          document.getElementById('user-name').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
          document.getElementById('user-handle').innerText = user.username ? '@' + user.username : 'Gizli Kullanıcı';
          document.getElementById('user-avatar').innerText = user.first_name ? user.first_name.charAt(0).toUpperCase() : 'U';
        }
      }
    });

    function startRoom() {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.showAlert) {
        window.Telegram.WebApp.showAlert("Yeni oda başlatılıyor...");
      } else {
        alert("Yeni oda başlatılıyor...");
      }
    }
  </script>
</body>
</html>
